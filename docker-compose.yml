services:
  rtsp-recorder:
    build: .
    image: rtsp-recorder:latest
    container_name: rtsp-recorder
    # host-specific values come from a gitignored .env beside this file
    restart: ${RTSP_RESTART:-unless-stopped}
    ports:
      - "${RTSP_HOST_PORT:-8765}:8765"
    volumes:
      - ${RTSP_DATA_DIR:-./data}:/data
    environment:
      - RTSP_RECORDER_DATA_DIR=/data
